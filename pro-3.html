<!DOCTYPE html>
<html>
<head>
    <title>NanoPulse Registration Form</title>
</head>

<body>

<form>

    <h2>NanoPulse</h2>
    <h3>Nanotechnology Innovations for Healthcare and Energy</h3>

    <label>First Name:</label>
    <input type="text"><br><br>

    <label>Last Name:</label>
    <input type="text"><br><br>

    <label>Address:</label>
    <input type="text"><br><br>

    <label>City:</label>
    <input type="text"><br><br>

    <label>State:</label>
    <input type="text"><br><br>

    <label>Zip Code:</label>
    <input type="text"><br><br>

    <label>Date of Birth:</label>
    <input type="date"><br><br>

    <label>Phone:</label>
    <input type="tel"><br><br>

    <label>E-mail Address:</label>
    <input type="email"><br><br>

    <label>Area of Interest:</label>
    <select>
        <option>Healthcare Nanotechnology</option>
        <option>Energy Nanotechnology</option>
        <option>Nanomaterials</option>
        <option>Drug Delivery</option>
        <option>Renewable Energy</option>
    </select><br><br>

    <label>Project Name:</label>
    <input type="text"><br><br>

    <label>Special Requirements:</label><br>
    <textarea rows="4" cols="30"
        placeholder="Enter your requirements here"></textarea><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Clear">

</form>

</body>
</html>
